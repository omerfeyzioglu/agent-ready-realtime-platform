# The ops API (HTTP /v1 + MCP /mcp) in the cluster. IMAGE_TAG is filled in
# at apply time:
#   sed "s/IMAGE_TAG/<tag>/" k8s/serving/api.yaml | kubectl apply -f -
# Reach it from a laptop with:
#   kubectl -n serving port-forward svc/api 8000:8000
apiVersion: v1
kind: Namespace
metadata:
  name: serving
---
# The API's identity. EKS Pod Identity maps serving/api to the IAM role
# nyc-taxi-eks-api (serving.tf): read-only, served tables only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: serving
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: 969788248726.dkr.ecr.us-east-1.amazonaws.com/nyc-taxi/api:IMAGE_TAG
          ports:
            - containerPort: 8000
          env:
            # Inside the cluster Redis is a service name, no tunnel.
            - name: REDIS_HOST
              value: redis.redis
            - name: REDIS_PORT
              value: "6379"
            # Password of the read-only Redis user "api".
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-api
                  key: password
          # /health answers without touching Redis or S3, so a Redis outage
          # does not get the API restarted (tools report it instead).
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # DuckDB may spill to disk; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: serving
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
