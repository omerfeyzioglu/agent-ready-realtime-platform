# One replay run of the producer. IMAGE_TAG is filled in at apply time:
#   sed "s/IMAGE_TAG/<tag>/" k8s/producer/job.yaml | kubectl apply -f -
# Args decide the range and speed; on start it continues after the newest
# event already in trip-events.
apiVersion: batch/v1
kind: Job
metadata:
  name: producer
  namespace: kafka
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: producer
    spec:
      serviceAccountName: producer
      restartPolicy: Never
      containers:
        - name: producer
          image: 969788248726.dkr.ecr.us-east-1.amazonaws.com/nyc-taxi/producer:IMAGE_TAG
          args:
            # Both live months; continues after the newest event already in
            # the topic. Speed 10 = one data hour every 6 minutes.
            - --months=2026-08,2026-09
            - --sink=kafka
            - --speed=10
            # Publish the replay clock (the platform's "now") every second.
            - --redis-addr=redis.redis:6379
          env:
            # Password of the restricted Redis user "producer" (replay:* only).
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-producer
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        # Scratch disk on the node for the downloaded source file; removed
        # with the pod.
        - name: data
          emptyDir:
            sizeLimit: 5Gi
