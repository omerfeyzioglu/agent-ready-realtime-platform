# Live features: Kafka trip-events -> per-zone minute values in Redis
# (latest) and Iceberg features.feat_zone_minute_live (history);
# definitions in features/live.yaml. IMAGE_TAG is filled in at apply time:
#   sed "s/IMAGE_TAG/<tag>/" k8s/flink/live-features.yaml | kubectl apply -f -
# Needs the Redis password in this namespace:
#   kubectl -n flink create secret generic redis-auth --from-literal=password=...
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: live-features
  namespace: flink
spec:
  image: 969788248726.dkr.ecr.us-east-1.amazonaws.com/nyc-taxi/live-features:IMAGE_TAG
  flinkVersion: v2_1
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    # Every 5 minutes: save state (open requests, recent waits), commit the
    # Iceberg rows written since the last checkpoint and the Kafka offsets
    # together. Redis is written every minute regardless; the history table
    # lags by up to 5 minutes, and fewer commits mean fewer small files.
    execution.checkpointing.interval: 5min
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.dir: s3://nyc-taxi-raw-969788248726/ops/flink/live-features/checkpoints
    execution.checkpointing.savepoint-dir: s3://nyc-taxi-raw-969788248726/ops/flink/live-features/savepoints
    state.backend.type: hashmap
    high-availability.type: kubernetes
    high-availability.storageDir: s3://nyc-taxi-raw-969788248726/ops/flink/live-features/ha
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: ENABLE_BUILT_IN_PLUGINS
              value: flink-s3-fs-hadoop-2.1.2.jar
            - name: REDIS_HOST
              value: redis.redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
  jobManager:
    resource:
      memory: 1024m
      cpu: 0.5
  taskManager:
    resource:
      memory: 1536m
      cpu: 1
  job:
    jarURI: local:///opt/flink/usrlib/live-features.jar
    entryClass: live.LiveFeaturesJob
    parallelism: 1
    upgradeMode: last-state
