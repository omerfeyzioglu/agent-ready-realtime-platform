# Single-node Kafka in KRaft mode (no ZooKeeper), managed by the Strimzi
# operator. One node is both controller (cluster metadata) and broker
# (messages). Replication factor 1 everywhere: there is no second broker,
# so losing this node's disk loses the messages not yet in raw.trip_events.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: kafka
  labels:
    strimzi.io/cluster: events
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 30Gi
    class: gp3
    # Deleting the Kafka cluster also deletes its EBS volume (no orphan disk).
    deleteClaim: true
    kraftMetadata: shared
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 2Gi
  jvmOptions:
    # Half the pod memory for the JVM heap; Kafka relies on the OS page
    # cache for the rest.
    "-Xms": 1g
    "-Xmx": 1g
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: events
  namespace: kafka
spec:
  kafka:
    version: 4.3.2
    listeners:
      # Inside the cluster only: events-kafka-bootstrap.kafka:9092
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # One broker: every internal topic and default must use 1 copy.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Topics exist only when declared as KafkaTopic resources.
      auto.create.topics.enable: false
  entityOperator:
    # Turns KafkaTopic resources into real topics.
    topicOperator: {}
